[build-system]
build-backend = "setuptools.build_meta"
requires = [
    "setuptools>=45",
]

[project]
name = "rich-click"
description = "Format click help output nicely with rich"
readme = "README.md"
license = { file = "LICENSE" }
maintainers = [
    { name = "Phil Ewels", email = "phil@ewels.co.uk" },
    { name = "Daniel Reeves", email = "xdanielreeves@gmail.com" },
]
authors = [ { name = "Phil Ewels", email = "phil@ewels.co.uk" } ]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dynamic = [
    "version",
]
dependencies = [
    "click>=8",
    "colorama; platform_system=='Windows'",
    "rich>=12",
    "typing-extensions>=4; python_version<'3.11'",
]
optional-dependencies.async = [
    "anyio>=3",
    "asyncclick>=8.2.2.2; python_version>='3.11'",
    "asyncclick>=8.3.0.3; python_version<'3.11'",
]
urls.Documentation = "https://github.com/ewels/rich-click"
urls.Homepage = "https://github.com/ewels/rich-click"
urls.Issues = "https://github.com/ewels/rich-click/issues"
urls.Repository = "https://github.com/ewels/rich-click"
scripts.rich-click = "rich_click.cli:main"

[dependency-groups]
dev = [
    "anyio>=3",                                    # required by some asyncclick releases but missing from their metadata
    "asyncclick>=8.2.2.2; python_version>='3.11'", # asyncclick compat tests (tests/test_asyncclick.py)
    "asyncclick>=8.3.0.3; python_version<'3.11'",  # asyncclick compat tests (tests/test_asyncclick.py)
    "inline-snapshot>=0.24",
    "jsonschema>=4",
    "mypy>=2.3",
    "nodeenv>=1.9.1",
    "packaging>=25",
    "prek>=0.4.12",
    "pytest>=8.3.5",
    "pytest-cov>=5",
    "rich-codex>=1.3",
    "ruff>=0.16.2",
    "ty>=0.0.69",
    "typer>=0.15,<0.26",
    "types-setuptools>=75.8.0.20250110",
]
# The docs site itself is built with Astro Starlight (see docs/package.json);
# this group only covers the Python tooling used alongside it: rich-codex for
# regenerating terminal screenshots, and typer for the typer code snippets.
docs = [
    "rich-codex>=1.3",
    "typer>=0.15,<0.26",
]

[tool.setuptools]
dynamic.version = { attr = "rich_click.__version__" }

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "docs/",
    "sdist",
    "tests/fixtures/**",
    "venv",
]
lint.select = [
    "D",    # pydocstyle
    "E",    # pycodestyle
    "F",    # flake8
    "I001", # isort
    "UP",   # pyupgrade
    "W",    # pycodestyle
]
lint.ignore = [
    "D100", # Missing docstring in public module
    "D102", # Missing docstring in public method
    "D105", # Missing docstring in magic method
    "D203", # 1 blank line required before class docstring
    "D205", # 1 blank line required between summary line and description
    "D212", # Multi-line docstring summary should start at the first line
    "E731", # Do not assign a lambda expression, use a def
]
lint.exclude = [
    "examples/**",
]
lint.per-file-ignores."tests/**/*.py" = [
    "D",
]
lint.isort.known-first-party = [ "rich_click" ]
lint.isort.lines-after-imports = 2

[tool.pyproject-fmt]
indent = 4

[tool.mypy]
exclude = [
    '.*?live_style_editor\.py$',
]
follow_imports = "normal"
python_version = "3.10"
strict = true
scripts_are_modules = true

[[tool.mypy.overrides]]
module = [ "asyncclick.*" ]
ignore_missing_imports = true

# rich_click.rich_async_command composes rich-click's click-typed mixins onto
# asyncclick's separately-typed parallel class tree. The resulting diamond
# inheritance and the click-vs-asyncclick type divergence (asyncclick's Context,
# ClickException and async main/to_info_dict differ from click's) produce
# structural errors: incompatible base definitions (misc), async overrides of sync
# click signatures (override), asyncclick types where click types are declared
# (arg-type), and awaiting asyncclick's async helpers (func-returns-value). These
# are artifacts of bridging two parallel Context/Command trees, not correctness
# issues. Codes that catch real mistakes (attr-defined, index, return-value,
# call-arg, assignment) stay enabled.
[[tool.mypy.overrides]]
module = [ "rich_click.rich_async_command" ]
disable_error_code = [ "arg-type", "func-returns-value", "misc", "override" ]

# The asyncclick compatibility tests decorate locally-typed callbacks with
# asyncclick's command/option decorators, which are untyped from mypy's view, so
# disallow_untyped_decorators flags them. This is inherent to testing an untyped
# fork; the test functions themselves are still fully annotated.
[[tool.mypy.overrides]]
module = [ "tests.test_asyncclick" ]
disallow_untyped_decorators = false

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
include = [ "src" ]
executionEnvironments = [
    { root = "src" },
    { root = "tests", extra_paths = [
        "src",
    ] },
]

[tool.pytest]
ini_options.testpaths = [ "tests" ]
ini_options.pythonpath = [ "tests", "src" ]
ini_options.addopts = "-s -rP -v --showlocals --cov --cov-report term"

[tool.inline-snapshot]
hash-length = 15
default-flags = [ "report" ]
default-flags-tui = [ "create", "review" ]
format-command = "ruff format --stdin-filename {filename}"
