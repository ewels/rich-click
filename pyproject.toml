[build-system]
build-backend = "setuptools.build_meta"
requires = [
    "setuptools>=45",
]

[project]
name = "rich-click"
description = "Format click help output nicely with rich"
readme = "README.md"
license = { file = "LICENSE" }
maintainers = [
    { name = "Phil Ewels", email = "phil@ewels.co.uk" },
    { name = "Daniel Reeves", email = "xdanielreeves@gmail.com" },
]
authors = [ { name = "Phil Ewels", email = "phil@ewels.co.uk" } ]
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dynamic = [
    "version",
]
dependencies = [
    "click>=8",
    "colorama; platform_system=='Windows'",
    "rich>=12",
    "typing-extensions>=4; python_version<'3.11'",
]
urls.Documentation = "https://github.com/ewels/rich-click"
urls.Homepage = "https://github.com/ewels/rich-click"
urls.Issues = "https://github.com/ewels/rich-click/issues"
urls.Repository = "https://github.com/ewels/rich-click"
scripts.rich-click = "rich_click.cli:main"

[dependency-groups]
dev = [
    "inline-snapshot>=0.24",
    "jsonschema>=4",
    "mypy>=2.3; python_version>='3.10'",
    "nodeenv>=1.9.1",
    "packaging>=25",
    "prek>=0.4.12",
    "pytest>=8.3.5",
    "pytest-cov>=5",
    "rich-codex>=1.3; python_version>='3.10'",
    "ruff>=0.16.2",
    "ty>=0.0.69",
    "typer>=0.15,<0.26",
    "types-setuptools>=75.8.0.20250110",
]
# The docs site itself is built with Astro Starlight (see docs/package.json);
# this group only covers the Python tooling used alongside it: rich-codex for
# regenerating terminal screenshots, and typer for the typer code snippets.
docs = [
    "rich-codex>=1.3",
    "typer>=0.15,<0.26",
]

[tool.setuptools]
dynamic.version = { attr = "rich_click.__version__" }

[tool.uv]
# rich-codex 1.3 (the first release to parse MDX comments) requires Python 3.10+,
# while the package itself still supports 3.8.
dependency-groups.docs = { requires-python = ">=3.10" }

[tool.ruff]
line-length = 120
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "docs/",
    "sdist",
    "tests/fixtures/**",
    "venv",
]
lint.select = [
    "D",    # pydocstyle
    "E",    # pycodestyle
    "F",    # flake8
    "I001", # isort
    "W",    # pycodestyle
]
lint.ignore = [
    "D100", # Missing docstring in public module
    "D102", # Missing docstring in public method
    "D105", # Missing docstring in magic method
    "D203", # 1 blank line required before class docstring
    "D205", # 1 blank line required between summary line and description
    "D212", # Multi-line docstring summary should start at the first line
    "E731", # Do not assign a lambda expression, use a def
]
lint.exclude = [
    "examples/**",
]
lint.per-file-ignores."tests/**/*.py" = [
    "D",
]
lint.isort.known-first-party = [ "rich_click" ]
lint.isort.lines-after-imports = 2

[tool.pyproject-fmt]
indent = 4

[tool.mypy]
exclude = [
    '.*?live_style_editor\.py$',
]
follow_imports = "normal"
python_version = "3.10"
strict = true
scripts_are_modules = true

[tool.pyright]
pythonVersion = "3.8"
typeCheckingMode = "basic"
include = [ "src" ]
executionEnvironments = [
    { root = "src" },
    { root = "tests", extra_paths = [
        "src",
    ] },
]

[tool.pytest]
ini_options.testpaths = [ "tests" ]
ini_options.pythonpath = [ "tests", "src" ]
ini_options.addopts = "-s -rP -v --showlocals --cov --cov-report term"

[tool.inline-snapshot]
hash-length = 15
default-flags = [ "report" ]
default-flags-tui = [ "create", "review" ]
format-command = "ruff format --stdin-filename {filename}"
