name: Test Coverage

on:
  push:
  pull_request:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        click: [8.0.*, 8.1.*, 8.2.*, 8.3.*, 8.4.*, 8.5.*]
        rich: [12.*, 13.*, 14.*, 15.*]
        typer: [0.17.*, 0.25.*]
        exclude:
          - typer: 0.25.*
            rich: 12.*
          - click: 8.0.*
            typer: 0.25.*
          - click: 8.1.*
            typer: 0.25.*
          - click: 8.2.*
            typer: 0.25.*
    steps:
      - name: Check out the repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: ${{ matrix.python }}
          activate-environment: true

      - name: Run tests
        run: |
          uv run \
            --with "click==$CLICK_VERSION" \
            --with "rich==$RICH_VERSION" \
            --with "typer==$TYPER_VERSION" \
            --prerelease=allow \
            pytest --cov --cov-report term
        env:
          CLICK_VERSION: ${{ matrix.click }}
          RICH_VERSION: ${{ matrix.rich }}
          TYPER_VERSION: ${{ matrix.typer }}

  test-asyncclick:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - python: "3.10"
            asyncclick: "asyncclick==8.3.0.3"
          - python: "3.11"
            asyncclick: "asyncclick==8.2.2.2"
          - python: "3.13"
            asyncclick: "asyncclick>=8.2.2.2"
    steps:
      - name: Check out the repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: ${{ matrix.python }}
          activate-environment: true

      - name: Install asyncclick test environment
        run: |
          uv pip install --editable ".[async]" "$ASYNCCLICK_REQUIREMENT" \
            inline-snapshot pytest pytest-cov typer
        env:
          ASYNCCLICK_REQUIREMENT: ${{ matrix.asyncclick }}

      - name: Run asyncclick tests
        run: |
          python -c "import asyncclick"
          pytest tests/test_asyncclick.py

      - name: Run async example
        run: python examples/13_async.py --help | grep -q "Usage:"
