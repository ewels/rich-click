name: Test Coverage

on:
  push:
  pull_request:

permissions: {}

jobs:
  # One job per Python version, each running every click / rich / typer combination
  # (listed in .github/scripts/test_matrix.py) a few at a time. One job per combination
  # meant ~200 short jobs, mostly spent queueing for runners.
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
          activate-environment: true

      - name: Install dependencies
        run: uv sync --prerelease=allow

      - name: Run tests for each click / rich / typer combination
        run: python .github/scripts/test_matrix.py

  coverage:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
          activate-environment: true

      - name: Run tests with coverage
        run: uv run pytest --cov --cov-report term

  test-asyncclick:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - python: "3.10"
            asyncclick: "asyncclick==8.3.0.3"
            click: "click>=8"
          - python: "3.11"
            asyncclick: "asyncclick==8.2.2.2"
            click: "click>=8"
          - python: "3.13"
            asyncclick: "asyncclick>=8.2.2.2"
            click: "click>=8"
          - python: "3.13"
            asyncclick: "asyncclick>=8.2.2.2"
            click: "click==8.1.*"
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
          activate-environment: true

      - name: Install asyncclick test environment
        run: |
          uv pip install --editable ".[async]" "$ASYNCCLICK_REQUIREMENT" "$CLICK_REQUIREMENT" \
            inline-snapshot pytest pytest-cov typer
        env:
          ASYNCCLICK_REQUIREMENT: ${{ matrix.asyncclick }}
          CLICK_REQUIREMENT: ${{ matrix.click }}

      - name: Run asyncclick tests
        run: |
          python -c "import asyncclick"
          pytest tests/test_asyncclick.py

      - name: Run async example
        run: python examples/13_async.py --help | grep -q "Usage:"

  test-no-asyncclick:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
          activate-environment: true

      - name: Run introspection tests without asyncclick
        run: uv run --no-dev --with pytest --with pytest-cov --with typer pytest tests/test_no_asyncclick.py
