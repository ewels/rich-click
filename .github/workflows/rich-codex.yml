name: Rich-codex
on:
  workflow_dispatch:

permissions: {}

jobs:
  rich_codex:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # rich-codex commits & pushes generated screenshots
    steps:
      - name: Check out the repo
        # persisted credentials are required for rich-codex to push commits
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]

      - name: Set up Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.13"
          activate-environment: true

      - name: Install dependencies
        run: uv sync --active --no-default-groups --group docs

      - name: Generate terminal images with rich-codex
        uses: ewels/rich-codex@74d8432695de542da2f2acdbc5681cdf306791ec # v1.3.0
        with:
          use_uv: "true"
          skip_python_setup: "true"
          commit_changes: "true"
          skip_git_checks: "true"
