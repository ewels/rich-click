name: Rich-codex
on:
  workflow_dispatch:

permissions: {}

jobs:
  rich_codex:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # rich-codex commits & pushes generated screenshots
    steps:
      - name: Check out the repo
        # persisted credentials are required for rich-codex to push commits
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]

      - name: Set up Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
          activate-environment: true

      - name: Install dependencies
        run: uv sync --active --no-default-groups --group docs

      - name: Generate terminal images with rich-codex
        uses: ewels/rich-codex@f6d8165f6ab813603db81a49def997104f4fcd5a # v1.4.0
        with:
          use_uv: "true"
          skip_python_setup: "true"
          commit_changes: "true"
          skip_git_checks: "true"
