name: Build docs
on:
  workflow_dispatch:
  push:
    branches:
      - main

# Cancel if a newer run is started
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
   contents: write

jobs:
  build_docs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        # persisted credentials are required for the rich-codex step to push commits
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3 # zizmor: ignore[artipacked]
        with:
          # Full history and tags: starlight-pydocs extracts past release tags to
          # work out which version each API object was added in.
          fetch-depth: 0

      - name: Set up Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.13"
          activate-environment: true

      - name: Install dependencies
        run: uv sync --active --group docs

      - name: Generate terminal images with rich-codex
        if: github.repository_owner == 'ewels' || github.event_name == 'workflow_dispatch'
        uses: ewels/rich-codex@74d8432695de542da2f2acdbc5681cdf306791ec # v1.3.0
        with:
          skip_python_setup: "true"
          commit_changes: "true"
#          clean_img_paths: docs/images/*.svg
          terminal_width: 80
          skip_git_checks: "true"
          working_dir: "."

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json

      # The API reference badges each object with the release it appeared in, by
      # extracting every v1.* tag with griffe. The dumps are keyed by commit, so
      # they only need generating once per tag across all builds.
      - name: Key the API version cache on the tag list
        id: pydocs_refs
        run: echo "key=$(git tag --list 'v1.*' | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Restore the API version dumps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Dumps only: the worktrees beside them are large and cheap to remake.
          path: docs/.cache/starlight-pydocs/versions
          key: pydocs-versions-${{ steps.pydocs_refs.outputs.key }}
          restore-keys: pydocs-versions-

      - name: Configure git for deploy commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Build and deploy docs
        run: uv run --with . docs/_deploy.py
        env:
          PACKAGE_NAME: rich-click
