[[repos]]
repo = "https://github.com/rhysd/actionlint"
rev = "914e7df21a07ef503a81201c76d2b11c789d3fca"  # frozen: v1.7.12
hooks = [
  { id = "actionlint" }
]

[[repos]]
repo = "https://github.com/tox-dev/pyproject-fmt"
rev = "3c6e76e10abcae02303212289efed3413350769c"  # frozen: v2.30.6
hooks = [
  { id = "pyproject-fmt" }
]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "ef6cf06c079dd6b299dfc720b0f14400c9d168e1"  # frozen: v0.17.5
hooks = [
  {
    id = "ruff-check",
    name = "Ruff",
    args = ["--fix"]
  },
  {
    id = "ruff-format",
    name = "Ruff format"
  }
]

[[repos]]
repo = "local"
hooks = [
  {
    id = "mypy",
    name = "mypy - Static type checking",
    description = "Mypy helps ensure that we use our functions and variables correctly by checking the types.",
    entry = "mypy",
    language = "system",
    types = ["python"],
    exclude = "^examples|^docs/",
    require_serial = true
  },
  {
    # Passing .py paths makes mypy check them instead of their .pyi stubs, so check
    # the package as a whole, where the stubs take precedence.
    id = "mypy-stubs",
    name = "mypy - Type stubs",
    entry = "mypy src",
    language = "system",
    types_or = ["python", "pyi"],
    files = "^src/",
    pass_filenames = false,
    require_serial = true
  }
]

[[repos]]
repo = "https://github.com/codespell-project/codespell"
rev = "57b21406f092110c18776e39b0bda50d37c945c8"  # frozen: v2.4.3
hooks = [
  {
    id = "codespell",
    files = '^docs/.*\.md$',
    additional_dependencies = ["tomli"]
  }
]
